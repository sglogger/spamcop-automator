[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spamcop-automator"
version = "0.1.0"
description = "Automatically confirm pending spam reports on SpamCop.net"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spamcop-automator = "spamcop_automator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spamcop_automator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
